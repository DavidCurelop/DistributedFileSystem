services:
  cn1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: controlnode
    container_name: cn1
    environment:
      - PORT=50051
      - NODE_ID=cn1
      - RAFT_PEERS=cn1=cn1:50051,cn2=cn2:50051,cn3=cn3:50051
      - RAFT_DIR=/data/raft
    volumes:
      - cn1-raft:/data/raft
    ports:
      - "50051:50051"
    networks:
      - dfs-network
    restart: unless-stopped

  cn2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: controlnode
    container_name: cn2
    environment:
      - PORT=50051
      - NODE_ID=cn2
      - RAFT_PEERS=cn1=cn1:50051,cn2=cn2:50051,cn3=cn3:50051
      - RAFT_DIR=/data/raft
    volumes:
      - cn2-raft:/data/raft
    ports:
      - "50055:50051"
    networks:
      - dfs-network
    restart: unless-stopped

  cn3:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: controlnode
    container_name: cn3
    environment:
      - PORT=50051
      - NODE_ID=cn3
      - RAFT_PEERS=cn1=cn1:50051,cn2=cn2:50051,cn3=cn3:50051
      - RAFT_DIR=/data/raft
    volumes:
      - cn3-raft:/data/raft
    ports:
      - "50056:50051"
    networks:
      - dfs-network
    restart: unless-stopped

  datanode-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: datanode
    container_name: datanode-1
    environment:
      - PORT=50052
      - DATA_DIR=/data/chunks
    volumes:
      - datanode-1-chunks:/data/chunks
    ports:
      - "50052:50052"
    networks:
      - dfs-network
    restart: unless-stopped
    depends_on:
      - cn1
      - cn2
      - cn3
    command: ["-ctrlAdr=cn1:50051,cn2:50051,cn3:50051", "-nodeAdr=datanode-1:50052", "-data-dir=/data/chunks"]

  datanode-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: datanode
    container_name: datanode-2
    environment:
      - PORT=50052
      - DATA_DIR=/data/chunks
    volumes:
      - datanode-2-chunks:/data/chunks
    ports:
      - "50053:50052"
    networks:
      - dfs-network
    restart: unless-stopped
    depends_on:
      - cn1
      - cn2
      - cn3
    command: ["-ctrlAdr=cn1:50051,cn2:50051,cn3:50051", "-nodeAdr=datanode-2:50052", "-data-dir=/data/chunks"]

  datanode-3:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: datanode
    container_name: datanode-3
    environment:
      - PORT=50052
      - DATA_DIR=/data/chunks
    volumes:
      - datanode-3-chunks:/data/chunks
    ports:
      - "50054:50052"
    networks:
      - dfs-network
    restart: unless-stopped
    depends_on:
      - cn1
      - cn2
      - cn3
    command: ["-ctrlAdr=cn1:50051,cn2:50051,cn3:50051", "-nodeAdr=datanode-3:50052", "-data-dir=/data/chunks"]

  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: client
    container_name: client
    environment:
      - CONTROL_ADDR=cn1:50051,cn2:50051,cn3:50051
    depends_on:
      - cn1
      - cn2
      - cn3
      - datanode-1
      - datanode-2
      - datanode-3
    networks:
      - dfs-network

networks:
  dfs-network:
    driver: bridge

volumes:
  cn1-raft:
  cn2-raft:
  cn3-raft:
  datanode-1-chunks:
  datanode-2-chunks:
  datanode-3-chunks: