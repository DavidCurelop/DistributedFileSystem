syntax = "proto3";

option go_package = "distributedFileSystem/pkg/proto/datanode";
package datanode;

service DataNodeService {
  // TODO: Define StoreChunk RPC (receives chunk payload, checksum, and downstream replica targets)
  rpc StoreChunk (StoreChunkRequest) returns (StoreChunkResponse); 
  // TODO: Define GetChunk RPC (retrieves chunk data and checksum by chunk ID)
  rpc GetChunk (GetChunkRequest) returns (GetChunkResponse); 
  // TODO: Define ReplicateChunk RPC (DataNode-to-DataNode replication transfer)
  rpc ReplicateChunk (ReplicateChunkRequest) returns (ReplicateChunkResponse); 
}

// TODO: Define StoreChunkRequest, StoreChunkResponse
message StoreChunkRequest{
    string chunk_id = 1;
    bytes chunk_payload = 2;
    string check_sum = 3;
    repeated string replica_targets = 4;
}

message StoreChunkResponse{
    string chunk_id = 1;
    bool write_successful = 2; 
}
// TODO: Define GetChunkRequest, GetChunkResponse
message GetChunkRequest{
        string chunk_id = 1;
}
message GetChunkResponse{
    string chunk_id = 1;
    bytes chunk_payload = 2;
    string check_sum = 3;
}
// TODO: Define ReplicateChunkRequest, ReplicateChunkResponse
message ReplicateChunkRequest{
    string chunk_id = 1;
    bytes chunk_payload = 2;
    string check_sum = 3;
}
message ReplicateChunkResponse{
    string chunk_id = 1;
    bool write_successful = 2; 
}