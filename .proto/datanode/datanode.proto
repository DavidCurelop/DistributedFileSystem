syntax = "proto3";

option go_package = "distributedFileSystem/pkg/proto/datanode";
package datanode;

service DataNodeService {
  rpc StoreChunk (StoreChunkRequest) returns (StoreChunkResponse); 
  rpc GetChunk (GetChunkRequest) returns (GetChunkResponse); 
  rpc ReplicateChunk (ReplicateChunkRequest) returns (ReplicateChunkResponse); 
}

message StoreChunkRequest{
    string chunk_id = 1;
    bytes chunk_payload = 2;
    string check_sum = 3;
    repeated string replica_targets = 4;
}

message StoreChunkResponse{
    string chunk_id = 1;
    bool write_successful = 2; 
}
message GetChunkRequest{
        string chunk_id = 1;
}
message GetChunkResponse{
    string chunk_id = 1;
    bytes chunk_payload = 2;
    string check_sum = 3;
}
message ReplicateChunkRequest{
    string chunk_id = 1;
    bytes chunk_payload = 2;
    string check_sum = 3;
}
message ReplicateChunkResponse{
    string chunk_id = 1;
    bool write_successful = 2; 
}